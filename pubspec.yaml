name: school_admin
description: A school administrative desktop application built with Flutter.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.9
  smooth_page_indicator: ^1.1.0
  animate_do: ^3.1.2
  provider: ^6.1.1
  supabase_flutter: ^2.3.4
  http: ^1.0.0
  file_picker: ^8.0.0
  shared_preferences: ^2.5.4
  flutter_secure_storage: ^9.2.2
  csv: ^6.0.0
  excel: ^4.0.6
  pdf: ^3.11.3
  printing: ^5.14.2
  url_launcher: ^6.3.2
  webview_windows: ^0.4.0
  flutter_screenutil: ^5.9.3
  cryptography: ^2.7.0
  package_info_plus: ^8.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  msix: ^3.16.13
  mocktail: ^1.0.4
  test: ^1.25.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/bold/
    - assets/icons/linear/

msix_config:
  display_name: School Admin
  publisher_display_name: TBS Tech
  identity_name: com.tbstech.schooladmin
  msix_version: 1.0.0.0
  capabilities: internetClient
